# Build the solution on every push/PR; on master (or manually) also provision Azure and deploy:
#   API            -> Azure Container App
#   ImageStarter   -> Azure Container Apps Job (triggered by the generation-processes queue)
#   ImageGenerator -> Azure Container Apps Job (triggered by the weather-images queue)
#
# One-time setup (see infra/README.md):
#   1. Create the resource group and deploy infra/bootstrap/github-identity.bicep into it. That creates a
#      user-assigned managed identity with a federated credential for this repo's "production"
#      environment and Owner on the resource group (no Entra app registration / directory rights needed).
#   2. Secrets:   AZURE_CLIENT_ID (the identity's clientId), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#                 UNSPLASH_ACCESS_KEY
#      Variables: AZURE_RESOURCE_GROUP (optional, default ib-weatherapi)

name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a deployment halfway

env:
  DOTNET_VERSION: '10.0.x'
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'ib-weatherapi' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WeatherAPI.sln

      - name: Build
        run: dotnet build WeatherAPI.sln --configuration Release --no-restore

      - name: Lint Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/bootstrap/github-identity.bicep --stdout > /dev/null

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # OIDC login as the user-assigned managed identity from infra/bootstrap (no client secret).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The identity only has rights on this resource group, so it can't create it; fail early if missing.
      - name: Check resource group
        run: |
          if ! az group show --name "$RESOURCE_GROUP" --output none; then
            echo "::error::Resource group '$RESOURCE_GROUP' not found or not accessible. Create it and deploy infra/bootstrap/github-identity.bicep first (see infra/README.md)."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Same script as a manual deployment: dotnet publish -> Bicep (infrastructure) -> push images
      # with the .NET SDK -> Bicep (Container App + Jobs) -> smoke test.
      - name: Deploy (deploy.ps1)
        id: deploy
        shell: pwsh
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: ./deploy.ps1 -ResourceGroup "$env:RESOURCE_GROUP" -ImageTag "$env:IMAGE_TAG"

      - name: Summary
        if: success()
        run: | 
          echo "### API deployed: ${{ steps.deploy.outputs.apiUrl }}" >> "$GITHUB_STEP_SUMMARY"

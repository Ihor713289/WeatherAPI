# Build the solution on every push/PR; on master (or manually) also provision Azure and deploy:
#   API            -> Azure Container App
#   ImageStarter   -> Azure Container Apps Job (triggered by the generation-processes queue)
#   ImageGenerator -> Azure Container Apps Job (triggered by the weather-images queue)
#
# One-time setup (see infra/README.md):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential),
#              UNSPLASH_ACCESS_KEY
#   Variables: AZURE_RESOURCE_GROUP (default rg-weatherapi), AZURE_LOCATION (default westeurope)

name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a deployment halfway

env:
  DOTNET_VERSION: '10.0.x'
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-weatherapi' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WeatherAPI.sln

      - name: Build
        run: dotnet build WeatherAPI.sln --configuration Release --no-restore

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Provision infrastructure (storage, registry, environment)
        id: infra
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "infra-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters deployApps=false \
            --query properties.outputs --output json)
          echo "registry=$(echo "$outputs" | jq -r .registryName.value)" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(echo "$outputs" | jq -r .registryLoginServer.value)" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.infra.outputs.registry }}
          LOGIN_SERVER: ${{ steps.infra.outputs.loginServer }}
        run: |
          az acr login --name "$REGISTRY"
          # image name : Dockerfile (build context is the repository root)
          for pair in weatherapi-api:WeatherAPI weatherapi-starter:ImageStarter weatherapi-generator:ImageGenerator; do
            image="${pair%%:*}"; project="${pair##*:}"
            docker build --file "$project/Dockerfile" \
              --tag "$LOGIN_SERVER/$image:$IMAGE_TAG" \
              --tag "$LOGIN_SERVER/$image:latest" .
            docker push --all-tags "$LOGIN_SERVER/$image"
          done

      - name: Deploy API and jobs
        id: apps
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          apiUrl=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters deployApps=true imageTag="$IMAGE_TAG" unsplashAccessKey="$UNSPLASH_ACCESS_KEY" \
            --query properties.outputs.apiUrl.value --output tsv)
          echo "apiUrl=$apiUrl" >> "$GITHUB_OUTPUT"
          echo "### API deployed: $apiUrl" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          API_URL: ${{ steps.apps.outputs.apiUrl }}
        run: |
          # The API may scale from zero, so allow a few attempts. An unknown id must return 404.
          for attempt in $(seq 1 10); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$API_URL/api/images/smoke-test" || true)
            [ "$status" = "404" ] && echo "API is up" && exit 0
            echo "Attempt $attempt: HTTP $status, retrying..."; sleep 15
          done
          echo "API did not respond as expected"; exit 1
